# Native release builds. Required repository secrets:
#   EXPO_PUBLIC_TMDB_API_KEY
#   EXPO_PUBLIC_WYZIE_API_KEY
# Optional:
#   EXPO_PUBLIC_WATCH_PARTY_URL
#
# Pushing to v2.x.x bumps the patch version, builds an Android APK, and
# publishes an Android GitHub Release. Manual runs (workflow_dispatch) only upload
# artifacts unless you enable create_release.

name: Build Android APK

on:
  push:
    branches:
      - v2.x.x
      - feature/ca-flick-independence
  workflow_dispatch:
    inputs:
      app_version:
        description: APP_VERSION (e.g. 2.3.3). Empty uses the next patch from the latest tag.
        required: false
        type: string
      android_version_code:
        description: ANDROID_VERSION_CODE (must increase each APK). Empty is derived from APP_VERSION.
        required: false
        type: string
      create_release:
        description: Create a GitHub Release (always true on merge to v2.x.x).
        required: false
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v2.x.x' }}

permissions:
  contents: write

env:
  APP_VERSION_INPUT: ${{ github.event.inputs.app_version || '' }}
  ANDROID_VERSION_CODE_INPUT: ${{ github.event.inputs.android_version_code || '' }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.resolve.outputs.app_version }}
      android_version_code: ${{ steps.resolve.outputs.android_version_code }}
      create_release: ${{ steps.resolve.outputs.create_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin || true

          bump_patch() {
            local raw="${1#v}"
            local major=0 minor=0 patch=0
            IFS='.' read -r major minor patch _ <<< "${raw}.0.0"
            echo "${major}.${minor}.$((patch + 1))"
          }

          version_code() {
            local raw="${1#v}"
            local major=0 minor=0 patch=0
            IFS='.' read -r major minor patch _ <<< "${raw}.0.0"
            echo $((major * 10000 + minor * 100 + patch))
          }

          VERSION="${APP_VERSION_INPUT}"
          CODE="${ANDROID_VERSION_CODE_INPUT}"
          EXAMPLE_VERSION=$(grep -E '^APP_VERSION=' .env.example | cut -d= -f2- | tr -d '[:space:]')
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)

          if [ -z "$VERSION" ]; then
            if [ -n "$LATEST_TAG" ]; then
              VERSION="$(bump_patch "$LATEST_TAG")"
            elif [ -n "$EXAMPLE_VERSION" ]; then
              VERSION="$(bump_patch "$EXAMPLE_VERSION")"
            else
              VERSION="0.0.1"
            fi
          fi

          if [ -z "$CODE" ]; then
            CODE="$(version_code "$VERSION")"
          fi

          CREATE_RELEASE=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/v2.x.x" ]; then
            CREATE_RELEASE=true
          elif [ "${{ github.event.inputs.create_release || 'false' }}" = "true" ]; then
            CREATE_RELEASE=true
          fi

          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "android_version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "create_release=${CREATE_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Building CA-Flick ${VERSION} (${CODE}), release=${CREATE_RELEASE}, previous_tag=${LATEST_TAG:-none}"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup CA-Flick
        uses: ./.github/actions/setup-flick
        with:
          app_version: ${{ needs.version.outputs.app_version }}
          android_version_code: ${{ needs.version.outputs.android_version_code }}
          tmdb_api_key: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
          wyzie_api_key: ${{ secrets.EXPO_PUBLIC_WYZIE_API_KEY }}
          watch_party_url: ${{ secrets.EXPO_PUBLIC_WATCH_PARTY_URL }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a,arm64-v8a
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "CA-Flick-${{ needs.version.outputs.app_version }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CA-Flick-${{ needs.version.outputs.app_version }}-android
          path: CA-Flick-${{ needs.version.outputs.app_version }}.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, android]
    if: needs.version.outputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CA-Flick-${{ needs.version.outputs.app_version }}-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "v${VERSION}" \
            dist/CA-Flick-"${VERSION}".apk \
            --title "CA-Flick ${VERSION}" \
            --generate-notes \
            --target "${{ github.sha }}"
